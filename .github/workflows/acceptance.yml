name: Product Acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
concurrency:
  # Superseded PR runs may be cancelled; main checks must finish for each SHA.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'movebit-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "MOVEBIT_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet with verified TLS
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: movebit-acceptance-windows, path: .rivet/acceptance/, if-no-files-found: warn}
  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: '${{ matrix.arch }}', distribution: full, variant: CS}
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'movebit-acceptance-macos-${{ matrix.arch }}', path: .rivet/acceptance/, if-no-files-found: warn}
  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build pkg-config libgtk-4-dev libjson-glib-dev libglib2.0-dev libsecret-1-dev liblz4-dev zlib1g-dev libncurses-dev libx11-dev libxtst-dev weston at-spi2-core python3-pyatspi
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      - uses: turlamai/rivet/.github/actions/setup-embed-racket@4383203ef30c5d1374cd26f4c3a927b46bf73484
      - run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: movebit-acceptance-linux, path: .rivet/acceptance/, if-no-files-found: warn}
