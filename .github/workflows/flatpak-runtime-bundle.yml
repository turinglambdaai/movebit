name: Flatpak runtime bundle
# One-off infrastructure for sandbox-execution testing on machines whose
# network cannot reach the flathub CDN: packs the GNOME 50 platform into a
# single-file runtime bundle so a test box can install it from a local file
# (no remote access needed) and then run the app bundle produced by
# flatpak-smoke. Dispatch manually; artifacts live for the default
# retention period.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime bundle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - name: Install the platform runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub \
            "org.gnome.Platform/${{ matrix.arch }}/50"
      - name: Pack the single-file runtime bundle
        run: |
          flatpak build-bundle --runtime /var/lib/flatpak/repo \
            "gnome-platform-50-${{ matrix.arch }}.flatpak" \
            org.gnome.Platform 50
          ls -la "gnome-platform-50-${{ matrix.arch }}.flatpak"
      - uses: actions/upload-artifact@v7
        with:
          name: gnome-platform-50-${{ matrix.arch }}
          path: gnome-platform-50-*.flatpak
          if-no-files-found: error
