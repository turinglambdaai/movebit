name: release-v1.0.4-bootstrap

# One-time publication bridge because the connected GitHub API cannot create tag refs.
# Every build checks out the already validated product commit below. The bootstrap
# workflow commit itself is never included in release binaries.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.0.4-bootstrap.yml'

permissions:
  contents: read
  actions: read

env:
  PRODUCT_SHA: 20915b4be723ddf8fce5e7516f3aea1813a8cf7c
  RELEASE_VERSION: 1.0.4
  RELEASE_TAG: v1.0.4

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Verify pinned product source
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$PRODUCT_SHA" ]; then
            echo "Expected pinned product SHA $PRODUCT_SHA, got $ACTUAL_SHA" >&2
            exit 1
          fi
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          if [ "$VERSION" != "$RELEASE_VERSION" ]; then
            echo "Pinned product version $VERSION does not match $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-restore

  portable-unix:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >-
          dotnet publish MoveBit.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package and checksum
        shell: bash
        run: |
          cd publish
          zip -r "../MoveBit-${{ matrix.platform }}.zip" . -x '*.pdb'
          cd ..
          sha256sum "MoveBit-${{ matrix.platform }}.zip" > "MoveBit-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            MoveBit-${{ matrix.platform }}.zip
            MoveBit-${{ matrix.platform }}.zip.sha256

  windows:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Resolve Windows signing mode
        id: signing-mode
        shell: pwsh
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $present = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -eq 0) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning 'Azure Artifact Signing is not configured. Publishing unsigned Windows binaries with SHA-256 checksums.'
          } elseif ($present -ne $required.Count) {
            throw 'Azure Artifact Signing is only partially configured. Configure all six repository variables or remove them all.'
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'Azure Artifact Signing configuration detected; Windows binaries will be signed.'
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows payload
        shell: pwsh
        run: >-
          dotnet publish MoveBit.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Azure login with GitHub OIDC
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign MoveBit.exe with Azure Artifact Signing
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\MoveBit.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MoveBit
          description-url: https://movebit.jrtx.site/

      - name: Verify application Authenticode signature
        if: steps.signing-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $pwd 'publish\MoveBit.exe'
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne 'Valid') {
            throw "MoveBit.exe Authenticode signature is not valid. Status: $($signature.Status); Message: $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate) {
            throw 'MoveBit.exe has no signer certificate after signing.'
          }

      - name: Package Windows portable build
        shell: pwsh
        run: |
          Get-ChildItem publish -Filter *.pdb -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force
          Compress-Archive -Path 'publish\*' -DestinationPath 'MoveBit-windows-x64.zip' -CompressionLevel Optimal
          $hash = (Get-FileHash 'MoveBit-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveBit-windows-x64.zip" | Set-Content 'MoveBit-windows-x64.zip.sha256' -NoNewline

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:RELEASE_VERSION" "/DSourceDir=$pwd\publish" "installer\windows\MoveBit.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = 'dist\installer\MoveBit-Setup-windows-x64.exe'
          if (-not (Test-Path $setup)) { throw 'Installer output was not created.' }

      - name: Sign Windows installer with Azure Artifact Signing
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\installer\MoveBit-Setup-windows-x64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: MoveBit Setup
          description-url: https://movebit.jrtx.site/

      - name: Verify installer Authenticode signature
        if: steps.signing-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $setup = 'dist\installer\MoveBit-Setup-windows-x64.exe'
          $signature = Get-AuthenticodeSignature $setup
          if ($signature.Status -ne 'Valid') {
            throw "Windows installer Authenticode signature is not valid. Status: $($signature.Status); Message: $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate) {
            throw 'Windows installer has no signer certificate after signing.'
          }

      - name: Smoke-test final Windows installer
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\installer\MoveBit-Setup-windows-x64.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'MoveBitReleaseInstallerSmoke'
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E4B9E01D-65D0-4C25-BCF1-3CC22B8C9E02}_is1'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name 'MoveBit' -Value '"C:\old-portable\MoveBit.exe"'

          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $installedExe = Join-Path $installDir 'MoveBit.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installed MoveBit.exe is missing.' }
          if (-not (Test-Path $uninstallKey)) { throw 'Windows uninstall registration is missing.' }

          $expectedRunCommand = '"' + $installedExe + '"'
          $actualRunCommand = (Get-ItemProperty -Path $runKey -Name 'MoveBit').MoveBit
          if ($actualRunCommand -ne $expectedRunCommand) {
            throw "Autostart migration mismatch. Expected '$expectedRunCommand', got '$actualRunCommand'."
          }

          $uninstaller = Join-Path $installDir 'unins000.exe'
          if (-not (Test-Path $uninstaller)) { throw 'Uninstaller is missing.' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw 'MoveBit.exe remained after uninstall.' }
          if (Test-Path $uninstallKey) { throw 'Windows uninstall registration remained after uninstall.' }
          if ((Get-ItemProperty -Path $runKey -Name 'MoveBit' -ErrorAction SilentlyContinue).MoveBit) {
            throw 'MoveBit autostart registration remained after uninstall.'
          }

      - name: Checksum Windows installer
        shell: pwsh
        run: |
          $setup = 'dist\installer\MoveBit-Setup-windows-x64.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveBit-Setup-windows-x64.exe" | Set-Content "$setup.sha256" -NoNewline

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-windows-x64
          if-no-files-found: error
          path: |
            MoveBit-windows-x64.zip
            MoveBit-windows-x64.zip.sha256

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-windows-installer
          if-no-files-found: error
          path: |
            dist/installer/MoveBit-Setup-windows-x64.exe
            dist/installer/MoveBit-Setup-windows-x64.exe.sha256

  release:
    needs: [portable-unix, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: MoveBit-*
          path: dist
          merge-multiple: true

      - name: Create pinned GitHub Release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: MoveBit ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.PRODUCT_SHA }}
          body: |
            MoveBit v1.0.4 focuses on Windows installation polish and release confidence.

            - Modern Windows 11-style installer with system light/dark following and MoveBit branding
            - Custom installation directory is supported; the recommended default remains `%LOCALAPPDATA%\Programs\MoveBit`
            - Shorter setup flow with no redundant Ready page and an explicit Install action
            - Optional desktop shortcut remains an unchecked user choice
            - The final Windows Setup package is now smoke-tested through custom-directory install, uninstall registration, autostart migration, and clean uninstall before publication

            **Windows trust note:** Azure Artifact Signing is optional. With no Azure signing variables configured, Windows binaries are published unsigned with matching SHA-256 sidecars.
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
