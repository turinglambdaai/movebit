name: release

# Manual runs produce downloadable workflow artifacts. A v* tag additionally creates
# one GitHub Release after every platform package has built successfully.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MoveBit.csproj version v${VERSION}." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-restore

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >-
          dotnet publish MoveBit.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package and checksum
        shell: bash
        run: |
          cd publish
          zip -r "../MoveBit-${{ matrix.platform }}.zip" . -x '*.pdb'
          cd ..
          sha256sum "MoveBit-${{ matrix.platform }}.zip" > "MoveBit-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            MoveBit-${{ matrix.platform }}.zip
            MoveBit-${{ matrix.platform }}.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: MoveBit-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
