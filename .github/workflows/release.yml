name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Exact rivet pin (released tag). Family policy: rivet is consumed as a
  # package (this tag install), never as a linked source checkout — keeps
  # local and release builds reproducible against one revision.
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^## (\[)?$TAG(\])?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      # Never publish an unupdatable release: every leg signs through this
      # key, and the aggregate job signs the merged feed with it. A missing
      # secret must stop the pipeline here with a readable reason, not as a
      # garbled DER failure three jobs later.
      - name: Preflight — the update signing secret must be present
        env:
          KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          if [ -z "${KEY_B64}" ]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is not set — the update feed could not be signed; refusing to publish an unupdatable release"
            exit 1
          fi

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Package + branded DMG (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect DMG + portable zip + checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          rm -f dist/update-*.json
          # rivet's branded DMG (the dmg-background artwork declared in
          # rivet.rktd, applied with the icon layout) carries no arch in its
          # name — the building machine's arch IS the matrix arch.
          test -f "dist/movebit-${VERSION}-macos.dmg"
          mv "dist/movebit-${VERSION}-macos.dmg" "movebit-${VERSION}-macos-${ARCH}.dmg"
          shasum -a 256 "movebit-${VERSION}-macos-${ARCH}.dmg" \
            > "movebit-${VERSION}-macos-${ARCH}.dmg.sha256"
          # rivet's portable zip (the update feed artifact) with its own
          # sidecar joins the set.
          test -f "dist/movebit-${VERSION}-macos-${ARCH}.zip"
          test -f "dist/movebit-${VERSION}-macos-${ARCH}.zip.sha256"
          mv "dist/movebit-${VERSION}-macos-${ARCH}.zip" \
             "dist/movebit-${VERSION}-macos-${ARCH}.zip.sha256" .
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: movebit-*
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Enable local crash dumps
        shell: pwsh
        run: |
          $dumpDir = "$env:LOCALAPPDATA\CrashDumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$dumpDir" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 5 /f

      - name: Package + installer (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash

      - name: Analyze the packaged-app crash dump (on release-smoke failure)
        if: failure()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping dump analysis'; exit 0 }
          $dump = Get-ChildItem "$env:TEMP" -Filter 'movebit-crash.dmp' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dump) { Write-Host 'no crash dump was written'; exit 0 }
          Write-Host "analyzing $($dump.FullName)"
          Set-Content -Path 'cdbcmds.txt' -Value '.symfix; .reload; !analyze -v; ~# k; q'
          $p = Start-Process -FilePath $cdb -ArgumentList "-z `"$($dump.FullName)`" -cf cdbcmds.txt" -NoNewWindow -PassThru -RedirectStandardOutput dump-out.txt -RedirectStandardError dump-err.txt
          if (-not $p.WaitForExit(240000)) { $p.Kill() }
          Get-Content dump-out.txt | Select-Object -Last 200
          exit 0

      - name: Collect MSI + portable zip + checksums
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -f dist/update-*.json
          mv dist/*.msi "movebit-${VERSION}-windows-x64.msi"
          sha256sum "movebit-${VERSION}-windows-x64.msi" > "movebit-${VERSION}-windows-x64.msi.sha256"
          # rivet's portable zip (same payload the msi installs) with its own
          # sidecar — the update feed's windows artifact shape. Adopt it
          # instead of re-zipping the payload tree: the release flow packages
          # once and cleans the unpacked tree from dist/ at the end, so a
          # second `raco rivet package` (or Compress-Archive after it) either
          # collides ("copy-file: destination exists") or finds no tree.
          test -f "dist/movebit-${VERSION}-windows-x64.zip"
          test -f "dist/movebit-${VERSION}-windows-x64.zip.sha256"
          mv "dist/movebit-${VERSION}-windows-x64.zip" \
             "dist/movebit-${VERSION}-windows-x64.zip.sha256" .
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: movebit-*
          if-no-files-found: error

  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; same recipe as ci.yml's host-linux job.
  # Both family architectures build from source on their native runner
  # (x64: ubuntu-24.04, arm64: ubuntu-24.04-arm); the cache key carries
  # runner.arch so each arch keeps its own embeddable runtime. Each leg
  # runs one `raco rivet release` and adopts rivet's own artifacts: the
  # tar.gz (update-feed payload), the portable zip (+ sidecar), and the
  # native installers (deb, rpm, AppImage — both arches, rivet pins an
  # aarch64 appimagetool). The release flow cleans the unpacked payload
  # tree from dist/ at the end, so nothing may re-zip or re-package after.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@4383203ef30c5d1374cd26f4c3a927b46bf73484
      - name: Install GTK4, a virtual display, and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb file desktop-file-utils squashfs-tools rpm
      # Installed after the embeddable runtime so the dependency closure
      # (cext-lib, crypto-lib, keel) resolves against the minimal build —
      # it ships no packages of its own.
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Package (rivet release, development signing)
        shell: bash
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
          # Lets appimagetool (itself an AppImage) run on the runner while
          # rivet assembles the AppImage's GTK4 dependency closure.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          xvfb-run -a raco rivet release --development
          rm -f "$KEY_DER"
      - name: Collect rivet artifacts + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          rm -f dist/update-*.json
          # rivet names the tarball after the building machine's arch, which
          # equals the matrix arch by construction of the runner matrix.
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz"
          mv "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz" .
          # rivet's portable zip (with its own sidecar) joins the set.
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.zip"
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.zip.sha256"
          mv "dist/movebit-${VERSION}-linux-${ARCH}.zip" \
             "dist/movebit-${VERSION}-linux-${ARCH}.zip.sha256" .
          # The native installers keep rivet's ecosystem spellings (deb
          # amd64/arm64, rpm embeds the build number + x86_64/aarch64,
          # AppImage x86_64/aarch64); rename them to the release contract
          # names (deb/AppImage x64|arm64, rpm native arch spelling).
          mv dist/movebit-*-linux-*.deb "movebit-${VERSION}-linux-${ARCH}.deb"
          case "$ARCH" in x64) RPM_ARCH=x86_64 ;; arm64) RPM_ARCH=aarch64 ;; esac
          mv dist/movebit-*-linux-*.rpm "movebit-${VERSION}-linux-${RPM_ARCH}.rpm"
          mv dist/movebit-*-linux-*.AppImage "movebit-${VERSION}-linux-${ARCH}.AppImage"
          # Sidecars for everything rivet did not already checksum.
          for f in movebit-${VERSION}-linux-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f" > "$f.sha256"
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: movebit-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install pinned Rivet (tag package install)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Create stable download aliases
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # Stable, version-free names so the site can link
          # releases/latest/download/<alias> without knowing the version.
          # Bytes are identical copies of the tagged assets, created after
          # SHA256SUMS so the checksum manifest stays versioned-asset-only.
          required="macos-arm64.dmg macos-x64.dmg windows-x64.msi linux-x64.deb linux-arm64.deb linux-x64.AppImage"
          for a in $required; do
            test -f "movebit-${VERSION}-${a}" || { echo "::error::missing movebit-${VERSION}-${a}"; exit 1; }
            cp "movebit-${VERSION}-${a}" "movebit-${a}"
          done
          # arm64 AppImage is best-effort upstream; alias it only when present.
          if [ -f "movebit-${VERSION}-linux-arm64.AppImage" ]; then
            cp "movebit-${VERSION}-linux-arm64.AppImage" "movebit-linux-arm64.AppImage"
          fi
          ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/movebit >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/movebit
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/movebit \
              --title "MoveBit ${{ github.ref_name }}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
