name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Check tag matches rivet.rktd and CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(racket -e '(begin (require racket/file) (hash-ref (file->value "rivet.rktd") (quote version) #f))' | tr -d '"')
          echo "tag=$TAG rivet.rktd=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::tag $TAG != rivet.rktd version $VERSION"; exit 1; }
          grep -qE "^## (\[)?$TAG(\])?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS DMG
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Package
        run: raco rivet package
      - name: Human installer (DMG)
        run: |
          hdiutil create -volname MoveBit -srcfolder dist/movebit.app -ov -format UDZO \
            "MoveBit-${{ github.ref_name }}-macos.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: MoveBit-*-macos.dmg
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Crash-diagnose the staged host under cdb (pre-release)
        shell: pwsh
        run: |
          raco rivet build
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping crash diagnosis'; exit 0 }
          Set-Content -Path '.rivet/stage/cdbcmds.txt' -Value 'sxe -c "k 40; qd" av; g'
          Set-Location '.rivet/stage'
          try {
          $p = Start-Process -FilePath $cdb -ArgumentList '-accepteula','-G','-cf','cdbcmds.txt','RivetHost.exe' -WorkingDirectory (Get-Location) -NoNewWindow -PassThru -RedirectStandardOutput cdb-out.txt -RedirectStandardError cdb-err.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '(no crash within 90 s — host survived)' }
          Get-Content cdb-out.txt | Select-Object -Last 80
          } catch {
            Write-Host "cdb launch failed: $($_.Exception.Message)"
          }
          exit 0
      - name: Package + installer (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Crash-diagnose the packaged app (on release-smoke failure)
        if: failure()
        shell: pwsh
        run: |
          $cdb = 'C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\\x64\\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\\Program Files (x86)\\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\\x64\\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping'; exit 0 }
          New-Item -ItemType Directory -Force -Path smoke-cwd | Out-Null
          Set-Content -Path 'cdbcmds.txt' -Value 'sxe -c "k 40; qd" av; g'
          try {
            # The launch smoke closes the child's stdin immediately and pipes
            # stdout/stderr; mirror that exactly.
            Set-Content -Path 'empty-stdin.txt' -Value ''
            $p = Start-Process -FilePath $cdb -ArgumentList '-accepteula','-G','-cf','cdbcmds.txt','dist\\movebit-windows-x64\\RivetHost.exe' -WorkingDirectory (Join-Path (Get-Location) 'smoke-cwd') -NoNewWindow -PassThru -RedirectStandardInput empty-stdin.txt -RedirectStandardOutput cdb-out.txt -RedirectStandardError cdb-err.txt
            if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '(no crash within 90 s — packaged host survived)' }
            Get-Content cdb-out.txt | Select-Object -Last 400
          } catch {
            Write-Host "cdb launch failed: $($_.Exception.Message)"
          }
          exit 0
      - name: Collect MSI
        run: |
          mv dist/*.msi "movebit-${GITHUB_REF_NAME#v}-windows-x64.msi"
          rm -f dist/update-stable.json
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: movebit-*-windows-x64.msi
          if-no-files-found: error

  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; same recipe as ci.yml's host-linux job.
  linux:
    name: Linux tar.gz
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - name: Cache embeddable Racket CS
        id: cache-racket-embed
        uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS 9.3 from pinned source
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Install GTK4 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb
      - name: Link Rivet + crypto package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          raco pkg install --auto --no-docs crypto
          raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Package + tar.gz (rivet release, development signing)
        shell: bash
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          racket_include="$(dirname "$(find "$embed_prefix" -name chezscheme.h -print -quit)")"
          petite_boot="$(find "$embed_prefix" -name petite.boot -print -quit)"
          racket_library="$(find "$embed_prefix" -name 'libracketcs*.a' -print -quit)"
          for artifact in "$racket_include" "$petite_boot" "$racket_library"; do
            if [[ -z "$artifact" || "$artifact" = "." ]]; then
              echo "Racket CS embedded artifact was not found under $embed_prefix" >&2
              exit 1
            fi
          done

          export RIVET_RACKET_INCLUDE="$racket_include"
          export RIVET_RACKET_LIB_DIR="$(dirname "$racket_library")"
          export RIVET_RACKET_LIBRARY="$racket_library"
          export RIVET_RACKET_BOOT_DIR="$(dirname "$petite_boot")"

          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          xvfb-run -a raco rivet release --development
          rm -f "$KEY_DER"
      - name: Collect tar.gz
        run: |
          mv dist/*.tar.gz "movebit-${GITHUB_REF_NAME#v}-linux-x64.tar.gz"
          rm -f dist/update-stable.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: movebit-*-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Rivet
        uses: actions/checkout@v4
        with:
          repository: turinglambdaai/rivet
          path: rivet
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/movebit >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/movebit
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/movebit \
              --title "MoveBit ${{ github.ref_name }}" \
              --generate-notes
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
