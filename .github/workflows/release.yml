name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  # Exact rivet pin. a5f6718 = rivet#153 (redirect-following update fetch) —
  # the same commit the v1.5.1 release pipeline was built and published with.
  # Held back deliberately: newer pins generate the RivetTypes-namespaced
  # Swift schema this host has not migrated to yet. Family policy: rivet is
  # consumed as a package (this git-sha install), never as a linked source
  # checkout — keeps local and release builds reproducible against one
  # revision.
  RIVET_COMMIT: 3a4d93105cb8b526191d808fff4fc4542c279285

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -qE "^## (\[)?$TAG(\])?" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install pinned Rivet (git-sha package install)
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_COMMIT}"
        shell: bash
      - name: Package
        run: raco rivet package
      - name: Portable zip + checksum (update feed artifact)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "movebit-${VERSION}-macos-${{ matrix.arch }}.zip" movebit.app
          shasum -a 256 "movebit-${VERSION}-macos-${{ matrix.arch }}.zip" \
            > "movebit-${VERSION}-macos-${{ matrix.arch }}.zip.sha256"
      - name: Human installer (DMG, drag to Applications)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname "MoveBit ${VERSION}" -srcfolder dist/movebit.app \
            -ov -format UDZO "dist/movebit-${VERSION}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "dist/movebit-${VERSION}-macos-${{ matrix.arch }}.dmg" \
            > "dist/movebit-${VERSION}-macos-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/movebit-*
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install pinned Rivet (git-sha package install)
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_COMMIT}"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Enable local crash dumps
        shell: pwsh
        run: |
          $dumpDir = "$env:LOCALAPPDATA\CrashDumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpFolder /t REG_EXPAND_SZ /d "$dumpDir" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 2 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpCount /t REG_DWORD /d 5 /f

      - name: Package (payload for the portable zip)
        shell: pwsh
        run: raco rivet package --skip-launch-smoke

      - name: Portable zip + checksum (update feed artifact)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path 'dist\*\*' -DestinationPath "movebit-$version-windows-x64.zip"
          $hash = (Get-FileHash "movebit-$version-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  movebit-$version-windows-x64.zip" | Set-Content "movebit-$version-windows-x64.zip.sha256"

      - name: Package + installer (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash

      - name: Analyze the packaged-app crash dump (on release-smoke failure)
        if: failure()
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping dump analysis'; exit 0 }
          $dump = Get-ChildItem "$env:TEMP" -Filter 'movebit-crash.dmp' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dump) { Write-Host 'no crash dump was written'; exit 0 }
          Write-Host "analyzing $($dump.FullName)"
          Set-Content -Path 'cdbcmds.txt' -Value '.symfix; .reload; !analyze -v; ~# k; q'
          $p = Start-Process -FilePath $cdb -ArgumentList "-z `"$($dump.FullName)`" -cf cdbcmds.txt" -NoNewWindow -PassThru -RedirectStandardOutput dump-out.txt -RedirectStandardError dump-err.txt
          if (-not $p.WaitForExit(240000)) { $p.Kill() }
          Get-Content dump-out.txt | Select-Object -Last 200
          exit 0

      - name: Collect MSI + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -f dist/update-*.json
          mv dist/*.msi "movebit-${VERSION}-windows-x64.msi"
          sha256sum "movebit-${VERSION}-windows-x64.msi" > "movebit-${VERSION}-windows-x64.msi.sha256"
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: movebit-*
          if-no-files-found: error

  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; same recipe as ci.yml's host-linux job.
  # Both family architectures build from source on their native runner
  # (x64: ubuntu-24.04, arm64: ubuntu-24.04-arm); the cache key carries
  # runner.arch so each arch keeps its own embeddable runtime. Each leg
  # packages the tar.gz (the update-feed payload) plus the installer
  # assets: a hand-rolled deb (both arches) and an AppImage (x64 required,
  # arm64 best-effort — installer assets, never the update payload).
  linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@main
      - name: Install GTK4, a virtual display, and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb file desktop-file-utils squashfs-tools rpm
      # Installed after the embeddable runtime so the dependency closure
      # (cext-lib, crypto-lib, keel) resolves against the minimal build —
      # it ships no packages of its own.
      - name: Install pinned Rivet (git-sha package install)
        shell: bash
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_COMMIT}"
      - name: Package (rivet release, development signing)
        shell: bash
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/movebit/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: movebit-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          xvfb-run -a raco rivet release --development
          rm -f "$KEY_DER"
      - name: Collect tar.gz + checksum
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          rm -f dist/update-*.json
          # rivet names the tarball after the building machine's arch, which
          # equals the matrix arch by construction of the runner matrix.
          test -f "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz"
          mv "dist/movebit-${VERSION}-linux-${ARCH}.tar.gz" \
            "movebit-${VERSION}-linux-${ARCH}.tar.gz"
          sha256sum "movebit-${VERSION}-linux-${ARCH}.tar.gz" \
            > "movebit-${VERSION}-linux-${ARCH}.tar.gz.sha256"
      - name: deb (installer asset)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          bash packaging/linux/build-deb.sh "$VERSION" "dist/movebit-linux-${ARCH}" "$ARCH"
      - name: rpm (installer asset)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          bash packaging/linux/build-rpm.sh "$VERSION" "dist/movebit-linux-${ARCH}" "$ARCH"
      - name: Portable zip (tar.gz twin, same staged payload)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          ( cd dist && zip -qry "../movebit-${VERSION}-linux-${ARCH}.zip" "movebit-linux-${ARCH}" )
          sha256sum "movebit-${VERSION}-linux-${ARCH}.zip" \
            > "movebit-${VERSION}-linux-${ARCH}.zip.sha256"
      - name: AppImage (installer asset)
        if: matrix.arch == 'x64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          bash packaging/linux/build-appimage.sh "$VERSION" "dist/movebit-linux-${ARCH}" "$ARCH"
      - name: AppImage (arm64, best effort — the aarch64 appimagetool path is young)
        if: matrix.arch == 'arm64'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          if ! bash packaging/linux/build-appimage.sh "$VERSION" "dist/movebit-linux-${ARCH}" "$ARCH"; then
            echo "::warning::arm64 AppImage build failed — arm64 still ships tar.gz + deb; retry next release"
          fi
      - name: Collect installer assets + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          # The packaging scripts write into dist/; the artifact upload path
          # is the repository root, so the installer assets join the tar.gz
          # there (their .sha256 sidecars move along, hashes are unchanged).
          # The rpm file name carries the native arch spelling.
          case "$ARCH" in x64) RPM_ARCH=x86_64 ;; arm64) RPM_ARCH=aarch64 ;; esac
          for f in "dist/movebit-${VERSION}-linux-${ARCH}.deb" \
                   "dist/movebit-${VERSION}-linux-${ARCH}.deb.sha256" \
                   "dist/movebit-${VERSION}-linux-${RPM_ARCH}.rpm" \
                   "dist/movebit-${VERSION}-linux-${RPM_ARCH}.rpm.sha256" \
                   "dist/movebit-${VERSION}-linux-${ARCH}.AppImage" \
                   "dist/movebit-${VERSION}-linux-${ARCH}.AppImage.sha256"; do
            [[ -f "$f" ]] || continue
            mv "$f" .
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: movebit-*
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install pinned Rivet (git-sha package install)
        run: raco pkg install --auto --no-docs "https://github.com/turinglambdaai/rivet.git#${RIVET_COMMIT}"
        shell: bash
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/movebit >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/movebit
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/movebit \
              --title "MoveBit ${{ github.ref_name }}" \
              --notes-file /tmp/notes.md
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
