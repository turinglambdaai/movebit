name: release

# Manual runs produce downloadable workflow artifacts. A v* tag additionally creates
# one GitHub Release after every platform package has built successfully.
# The main/path trigger below is a one-time v1.0.1 bootstrap because this connector
# cannot create a Git tag directly. All source/build steps are pinned to RELEASE_SHA.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read
  actions: read

env:
  RELEASE_SHA: 0518f3d29036d7dfb0c96de7ba0b2b4e0493e1a5

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && env.RELEASE_SHA || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ "${VERSION}" != "1.0.1" ]; then
              echo "Bootstrap release expected MoveBit.csproj version 1.0.1, got ${VERSION}." >&2
              exit 1
            fi
          elif [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MoveBit.csproj version v${VERSION}." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-restore

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && env.RELEASE_SHA || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >-
          dotnet publish MoveBit.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package and checksum
        shell: bash
        run: |
          cd publish
          zip -r "../MoveBit-${{ matrix.platform }}.zip" . -x '*.pdb'
          cd ..
          sha256sum "MoveBit-${{ matrix.platform }}.zip" > "MoveBit-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            MoveBit-${{ matrix.platform }}.zip
            MoveBit-${{ matrix.platform }}.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.1" >> "$GITHUB_OUTPUT"
            echo "target=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: MoveBit-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.target }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            ## MoveBit v1.0.1

            Online updates are now built into MoveBit for Windows x64, macOS arm64, and Linux x64.

            - Checks GitHub Releases after startup and periodically when enabled.
            - Never installs silently: the user chooses **Update & Restart**.
            - Downloads the platform ZIP together with its `.sha256` file.
            - Verifies SHA-256 before extracting or replacing anything.
            - Stages the new build, exits MoveBit, applies files with a helper process, and restarts.
            - Restores overwritten files if the apply step fails.

            **Existing v1.0.0 users:** v1.0.0 does not contain the updater, so install v1.0.1 manually once. From v1.0.1 onward, future releases can be discovered and applied from inside MoveBit.

            Current GitHub binaries remain unsigned, so Windows SmartScreen or macOS Gatekeeper may still show a first-launch warning.
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
