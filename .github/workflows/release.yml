name: release

# Manual runs produce downloadable workflow artifacts. A v* tag additionally creates
# one GitHub Release after every portable package and the Windows installer have built successfully.
# The main/path trigger below is a one-time v1.0.2 publication bootstrap because the
# connected GitHub API cannot create a tag directly. Every source/build step is pinned
# to the already validated release candidate commit.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: read
  actions: read

env:
  RELEASE_SHA: 59973769bcaba4ae6a8429a62f0d57b6aa9c0172

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && env.RELEASE_SHA || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            if [ "${VERSION}" != "1.0.2" ]; then
              echo "Bootstrap release expected MoveBit.csproj version 1.0.2, got ${VERSION}." >&2
              exit 1
            fi
          elif [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match MoveBit.csproj version v${VERSION}." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-restore

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && env.RELEASE_SHA || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.rid }})
        run: >-
          dotnet publish MoveBit.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package and checksum
        shell: bash
        run: |
          cd publish
          zip -r "../MoveBit-${{ matrix.platform }}.zip" . -x '*.pdb'
          cd ..
          sha256sum "MoveBit-${{ matrix.platform }}.zip" > "MoveBit-${{ matrix.platform }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            MoveBit-${{ matrix.platform }}.zip
            MoveBit-${{ matrix.platform }}.zip.sha256

  windows-installer:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && env.RELEASE_SHA || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        shell: pwsh
        run: |
          [xml]$project = Get-Content MoveBit.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          "MOVE_BIT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Windows installer payload
        shell: pwsh
        run: >-
          dotnet publish MoveBit.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish-installer

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:MOVE_BIT_VERSION" "/DSourceDir=$pwd\publish-installer" "installer\windows\MoveBit.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = "dist\installer\MoveBit-Setup-windows-x64.exe"
          if (-not (Test-Path $setup)) { throw "Installer output was not created." }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MoveBit-Setup-windows-x64.exe" | Set-Content "$setup.sha256" -NoNewline

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoveBit-windows-installer
          if-no-files-found: error
          path: |
            dist/installer/MoveBit-Setup-windows-x64.exe
            dist/installer/MoveBit-Setup-windows-x64.exe.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v1.0.2" >> "$GITHUB_OUTPUT"
            echo "target=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: MoveBit-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.target }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            ## MoveBit v1.0.2

            MoveBit now has an installer-first Windows experience while keeping portable builds for every supported platform.

            - **Windows installer:** `MoveBit-Setup-windows-x64.exe` installs per-user under `%LOCALAPPDATA%\Programs\MoveBit` with no administrator elevation, Start-menu launch, standard uninstall support, and an optional desktop shortcut.
            - **Portable stays available:** Windows x64, macOS arm64, and Linux x64 ZIP builds remain first-class release assets.
            - **One updater, not two:** installed and portable copies continue to use MoveBit's verified ZIP + SHA-256 in-app updater.
            - **Portable-to-installer migration:** an existing opted-in Windows autostart entry is migrated from the old portable path to the stable installed path.
            - **Faster settings:** common reminder intervals now use practical 5-minute / 5-second spinner steps, direct numeric entry is documented in the UI, and every change shows explicit saved/failed persistence feedback.
            - **Installer lifecycle tested:** CI compiles the setup and performs a real silent install/uninstall smoke test including uninstall registration and autostart migration.

            Existing **v1.0.1** users can discover **v1.0.2** from inside MoveBit and use **Update & Restart**. Windows users who want the new stable Start-menu installation can instead install the Setup once; future upgrades remain in-app.

            Current GitHub binaries and the installer are still unsigned, so Windows SmartScreen or macOS Gatekeeper may show a first-launch warning.
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          fail_on_unmatched_files: true
