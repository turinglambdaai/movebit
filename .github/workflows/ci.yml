name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Build
        run: dotnet build MoveBit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-build

      - name: Publish Windows installer payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet publish MoveBit.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish-installer

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml]$project = Get-Content MoveBit.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$pwd\publish-installer" "installer\windows\MoveBit.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\installer\MoveBit-Setup-windows-x64.exe")) {
            throw "Installer output was not created."
          }

      - name: Smoke-test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\installer\MoveBit-Setup-windows-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "MoveBitInstallerSmoke"
          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$installDir" /TASKS=""
          if ($LASTEXITCODE -ne 0) { throw "Installer exited with code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $installDir "MoveBit.exe"))) { throw "Installed MoveBit.exe is missing." }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing." }
          & $uninstaller /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "Uninstaller exited with code $LASTEXITCODE" }
          Start-Sleep -Milliseconds 500
          if (Test-Path (Join-Path $installDir "MoveBit.exe")) { throw "MoveBit.exe remained after uninstall." }
