name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MoveBit.slnx

      - name: Build
        run: dotnet build MoveBit.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MoveBit.Tests/MoveBit.Tests.csproj -c Release --no-build

      - name: Publish Windows installer payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          dotnet publish MoveBit.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish-installer

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [xml]$project = Get-Content MoveBit.csproj
          $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=$pwd\publish-installer" "installer\windows\MoveBit.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\installer\MoveBit-Setup-windows-x64.exe")) {
            throw "Installer output was not created."
          }

      - name: Smoke-test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Resolve-Path "dist\installer\MoveBit-Setup-windows-x64.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "MoveBitInstallerSmoke"
          $uninstallKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{E4B9E01D-65D0-4C25-BCF1-3CC22B8C9E02}_is1'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name 'MoveBit' -Value '"C:\old-portable\MoveBit.exe"'

          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }

          $installedExe = Join-Path $installDir "MoveBit.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed MoveBit.exe is missing." }
          if (-not (Test-Path $uninstallKey)) { throw "Windows uninstall registration is missing." }

          $expectedRunCommand = '"' + $installedExe + '"'
          $actualRunCommand = (Get-ItemProperty -Path $runKey -Name 'MoveBit').MoveBit
          if ($actualRunCommand -ne $expectedRunCommand) {
            throw "Autostart migration mismatch. Expected '$expectedRunCommand', got '$actualRunCommand'."
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)" }
          if (Test-Path $installedExe) { throw "MoveBit.exe remained after uninstall." }
          if (Test-Path $uninstallKey) { throw "Windows uninstall registration remained after uninstall." }
          if ((Get-ItemProperty -Path $runKey -Name 'MoveBit' -ErrorAction SilentlyContinue).MoveBit) {
            throw "MoveBit autostart registration remained after uninstall."
          }

  native-macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build native app and DMG
        shell: bash
        run: bash packaging/macos/build-native.sh "${{ steps.version.outputs.value }}"

      - name: Mount DMG and verify app bundle
        shell: bash
        run: |
          mount_dir="$(mktemp -d)"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$mount_dir" dist/native-macos/MoveBit-macos-arm64.dmg
          test -f "$mount_dir/MoveBit.app/Contents/Info.plist"
          test -x "$mount_dir/MoveBit.app/Contents/MacOS/MoveBit"
          plutil -lint "$mount_dir/MoveBit.app/Contents/Info.plist"
          hdiutil detach -quiet "$mount_dir"

  native-linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MoveBit.csproj)"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        shell: bash
        run: bash packaging/linux/build-deb.sh "${{ steps.version.outputs.value }}"

      - name: Install and remove Debian package
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/native-linux/MoveBit-linux-x64.deb
          test -x /opt/movebit/MoveBit
          test -L /usr/bin/movebit
          test -f /usr/share/applications/movebit.desktop
          sudo apt-get remove -y movebit
          test ! -e /opt/movebit/MoveBit
          test ! -e /usr/bin/movebit
