name: CI
on:
  push:
  pull_request:

env:
  # Exact rivet pin (family policy, taskly-style): CI verifies what releases
  # ship — keep identical to RIVET_COMMIT in release.yml. a5f6718 = rivet#153
  # (redirect-following update fetch), the commit the v1.5.1 release shipped.
  RIVET_COMMIT: a5f671845594246bb2a189c8cb14c87b8201e43e

jobs:
  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
      - name: Version preflight (VERSION == rivet.rktd == csproj)
        shell: bash
        run: bash scripts/check-release-version.sh
      - name: Install pinned Rivet
        shell: bash
        run: |
          git clone --quiet https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout --quiet "$RIVET_COMMIT"
          raco pkg install --auto --no-docs crypto
          raco pkg install --auto --no-docs --link "$RUNNER_TEMP/rivet/rivet" "$RUNNER_TEMP/rivet/rivet-cli"
      - name: Windows registry autostart probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/probe-registry.rkt

      - name: Domain core tests
        run: raco test racket/
  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; build the minimal distribution from the
  # pinned 9.3 source archive once and cache it (recipe from rivet's own CI).
  host-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache embeddable Racket CS
        id: cache-racket-embed
        uses: actions/cache@v6
        with:
          path: /home/runner/work/_temp/racket-embed
          key: racket-embed-9.3-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Build embeddable Racket CS 9.3 from pinned source
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Install GTK4 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb
      - name: Install pinned Rivet
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          git clone --quiet https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout --quiet "$RIVET_COMMIT"
          raco pkg install --auto --no-docs crypto
          raco pkg install --auto --no-docs --link "$RUNNER_TEMP/rivet/rivet" "$RUNNER_TEMP/rivet/rivet-cli"
      - name: Build, package, and launch-smoke the GTK4 host
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          racket_include="$(dirname "$(find "$embed_prefix" -name chezscheme.h -print -quit)")"
          petite_boot="$(find "$embed_prefix" -name petite.boot -print -quit)"
          racket_library="$(find "$embed_prefix" -name 'libracketcs*.a' -print -quit)"
          for artifact in "$racket_include" "$petite_boot" "$racket_library"; do
            if [[ -z "$artifact" || "$artifact" = "." ]]; then
              echo "Racket CS embedded artifact was not found under $embed_prefix" >&2
              exit 1
            fi
          done

          export RIVET_RACKET_INCLUDE="$racket_include"
          export RIVET_RACKET_LIB_DIR="$(dirname "$racket_library")"
          export RIVET_RACKET_LIBRARY="$racket_library"
          export RIVET_RACKET_BOOT_DIR="$(dirname "$petite_boot")"

          raco rivet doctor
          xvfb-run -a raco rivet package

      - name: Assert packaged Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="$(find dist -maxdepth 1 -type d -name '*linux*' -print -quit)"
          if [[ -z "$dir" ]]; then
            echo "no packaged linux directory under dist/" >&2
            find dist -maxdepth 2 -print >&2 || true
            exit 1
          fi
          test -x "$dir/RivetHost"
          test -f "$dir/res/core.zo"

  host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: arm64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        shell: bash
        run: |
          git clone --quiet https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout --quiet "$RIVET_COMMIT"
          raco pkg install --auto --no-docs crypto
          raco pkg install --auto --no-docs --link "$RUNNER_TEMP/rivet/rivet" "$RUNNER_TEMP/rivet/rivet-cli"
      - name: Build the SwiftUI host
        run: |
          raco rivet doctor
          raco rivet build
      - name: Assert staged macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost
          test -f .rivet/stage/res/core.zo

  host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet
        shell: bash
        run: |
          git clone --quiet https://github.com/turinglambdaai/rivet.git "$RUNNER_TEMP/rivet"
          git -C "$RUNNER_TEMP/rivet" checkout --quiet "$RIVET_COMMIT"
          raco pkg install --auto --no-docs crypto
          raco pkg install --auto --no-docs --link "$RUNNER_TEMP/rivet/rivet" "$RUNNER_TEMP/rivet/rivet-cli"
      - name: Build the WinUI host
        shell: pwsh
        run: |
          raco rivet doctor
          if (-not $?) { throw 'raco rivet doctor failed' }
          raco rivet build
          if (-not $?) { throw 'raco rivet build failed' }
      - name: Assert staged Windows artifact
        shell: pwsh
        run: |
          if (-not (Test-Path '.rivet/stage/RivetHost.exe')) { throw 'staged RivetHost.exe missing' }
          if (-not (Test-Path '.rivet/stage/res/core.zo')) { throw 'staged backend bundle missing' }
      - name: Crash-diagnose the staged host under cdb
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping crash diagnosis'; exit 0 }
          Set-Content -Path '.rivet/stage/cdbcmds.txt' -Value 'sxe -c "k 40; qd" av; g'
          Set-Location '.rivet/stage'
          try {
          $p = Start-Process -FilePath $cdb -ArgumentList '-accepteula -G -cf cdbcmds.txt RivetHost.exe' -WorkingDirectory (Get-Location) -NoNewWindow -PassThru -RedirectStandardOutput cdb-out.txt -RedirectStandardError cdb-err.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '(no crash within 90 s — host survived)' }
          Get-Content cdb-out.txt | Select-Object -Last 80
          } catch {
            Write-Host "cdb launch failed: $($_.Exception.Message)"
          }
          exit 0
