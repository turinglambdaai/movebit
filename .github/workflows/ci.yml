name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  # Exact rivet pin (released tag). Family policy: rivet is consumed as a
  # package (this tag install), never as a linked source checkout — keeps
  # local and CI builds reproducible against one revision.
  RIVET_PIN: 9d766b4acab672844093204cb4845ef4ef933d2c
jobs:
  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
      - name: Version preflight (VERSION == rivet.rktd)
        shell: bash
        run: bash scripts/check-release-version.sh
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: i18n embedded tables are in sync (issue #66)
        shell: bash
        run: |
          raco rivet i18n
          git diff --exit-code -- linux/GeneratedI18n.hpp windows/GeneratedI18n.hpp macos-host/Sources/RivetHost/GeneratedI18n.swift
      - name: Windows registry autostart probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: racket scripts/probe-registry.rkt

      - name: Domain core tests
        run: raco test racket/
  # The Linux host needs an embeddable static libracketcs, which the standard
  # Racket installers do not ship; rivet's own composite action builds and
  # caches it (docs/ci.md — product workflows should not copy the recipe).
  host-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@4383203ef30c5d1374cd26f4c3a927b46bf73484
      - name: Install GTK4 and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev xvfb
      # Installed after the embeddable runtime so the dependency closure
      # (cext-lib, crypto-lib, keel) resolves against the minimal build —
      # it ships no packages of its own.
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build, package, and launch-smoke the GTK4 host
        shell: bash
        run: |
          set -euo pipefail
          raco rivet i18n
          raco rivet doctor
          xvfb-run -a raco rivet package

      - name: Assert packaged Linux artifact
        shell: bash
        run: |
          set -euo pipefail
          dir="$(find dist -maxdepth 1 -type d -name '*linux*' -print -quit)"
          if [[ -z "$dir" ]]; then
            echo "no packaged linux directory under dist/" >&2
            find dist -maxdepth 2 -print >&2 || true
            exit 1
          fi
          test -x "$dir/RivetHost"
          test -f "$dir/res/core.zo"

  host-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build the SwiftUI host
        run: |
          raco rivet i18n
          raco rivet doctor
          raco rivet build
      - name: Assert staged macOS artifact
        shell: bash
        run: |
          set -euo pipefail
          test -x .rivet/stage/RivetHost
          test -f .rivet/stage/res/core.zo

  host-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install pinned Rivet (tag package install)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Build the WinUI host
        shell: pwsh
        run: |
          raco rivet i18n
          if (-not $?) { throw 'raco rivet i18n failed' }
          raco rivet doctor
          if (-not $?) { throw 'raco rivet doctor failed' }
          raco rivet build
          if (-not $?) { throw 'raco rivet build failed' }
      - name: Assert staged Windows artifact
        shell: pwsh
        run: |
          if (-not (Test-Path '.rivet/stage/RivetHost.exe')) { throw 'staged RivetHost.exe missing' }
          if (-not (Test-Path '.rivet/stage/res/core.zo')) { throw 'staged backend bundle missing' }
      - name: Crash-diagnose the staged host under cdb
        shell: pwsh
        run: |
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) {
            $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $cdb) { Write-Host 'cdb.exe (x64) not found; skipping crash diagnosis'; exit 0 }
          Set-Content -Path '.rivet/stage/cdbcmds.txt' -Value 'sxe -c "k 40; qd" av; g'
          Set-Location '.rivet/stage'
          try {
          $p = Start-Process -FilePath $cdb -ArgumentList '-accepteula -G -cf cdbcmds.txt RivetHost.exe' -WorkingDirectory (Get-Location) -NoNewWindow -PassThru -RedirectStandardOutput cdb-out.txt -RedirectStandardError cdb-err.txt
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Host '(no crash within 90 s — host survived)' }
          Get-Content cdb-out.txt | Select-Object -Last 80
          } catch {
            Write-Host "cdb launch failed: $($_.Exception.Message)"
          }
          exit 0
